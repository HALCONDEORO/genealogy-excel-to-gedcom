name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install openpyxl
        run: python -m pip install "openpyxl==3.1.5"
      # Includes the end-to-end CLI gates (test_cli_gates.py): real entry
      # points and exit codes for check_evidencia full/--solo-ged,
      # reconcile.py and reconcile_v2.py, including negative gates that
      # must fail on a tampered GED.
      - name: Converter, reconciler and end-to-end CLI gate tests
        run: python -m unittest discover -s tests
      - name: Privacy remediation tests (offline; integration tests skip without GRAMPS_TEST_BASE)
        run: python -m unittest discover -s gramps_privacidad/tests -p "test_*.py"
